name: Metrics

on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: [main] }

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Overview
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          filename: metrics.svg
          user: geraldsberongoy
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Manila
          plugin_followup: yes
          plugin_followup_sections: repositories, user
          plugin_lines: yes
          plugin_languages: yes
          plugin_languages_limit: 8
          # indepth counts actual bytes per language across cloned repos, not just each repo's primary language.
          # Costs a few minutes of runner time per run; drop to plain languages if the job gets too slow.
          plugin_languages_indepth: yes
          plugin_languages_details: bytes-size, percentage
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          # plugin_achievements disabled: its GraphQL query still requests Projects (classic), which GitHub
          # sunset, so the whole query fails and the panel renders "Unexpected error". metrics is at v3.34
          # and unmaintained, and plugin_achievements_ignored does not help because the query runs before
          # any filtering. Re-enable if upstream ever drops the projectsV1 field.
          # plugin_achievements: yes
          # plugin_achievements_threshold: B
